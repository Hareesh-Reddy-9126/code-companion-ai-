name: Keep Supabase Awake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --max-time 30 \
            "https://gcszjbtdofquemrbumvg.supabase.co/functions/v1/health" \
            || echo "Health check failed; project may be paused."

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: code-companion-db
  namespace: code-companion
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 100Gi

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: code-companion-postgres
  namespace: code-companion
spec:
  serviceName: code-companion-postgres
  replicas: 1
  selector:
    matchLabels:
      app: code-companion
      component: postgres
  template:
    metadata:
      labels:
        app: code-companion
        component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: codecompanion
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: code-companion-db-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: code-companion-db-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: code-companion-db

---

apiVersion: v1
kind: Service
metadata:
  name: code-companion-postgres
  namespace: code-companion
spec:
  selector:
    app: code-companion
    component: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432

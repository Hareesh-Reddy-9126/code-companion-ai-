apiVersion: v1
kind: Secret
metadata:
  name: code-companion-secrets
  namespace: code-companion
type: Opaque
stringData:
  SUPABASE_URL: "https://your-project.supabase.co"
  SUPABASE_ANON_KEY: "your-anon-key"
  SUPABASE_SERVICE_ROLE_KEY: "your-service-role-key"
  NVIDIA_API_KEY: "your-nvidia-api-key"
  GITHUB_CLIENT_ID: "your-github-client-id"
  GITHUB_CLIENT_SECRET: "your-github-client-secret"
  ENCRYPTION_KEY: "your-32-char-encryption-key"
  APP_URL: "https://api.codecompanion.ai"

---

apiVersion: batch/v1
kind: CronJob
metadata:
  name: code-companion-keepalive
  namespace: code-companion
spec:
  schedule: "*/15 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: keepalive
              image: curlimages/curl:latest
              command:
                - /bin/sh
                - -c
                - curl -s https://api.codecompanion.ai/functions/v1/health > /dev/null || true
          restartPolicy: OnFailure

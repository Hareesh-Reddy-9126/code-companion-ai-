apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: code-companion-monitor
  namespace: code-companion
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: code-companion
  endpoints:
    - port: http
      path: /functions/v1/health
      interval: 30s

---

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: code-companion-alerts
  namespace: code-companion
  labels:
    release: prometheus
    role: alert-rules
spec:
  groups:
    - name: code-companion.rules
      rules:
        - alert: HighErrorRate
          expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "High error rate on Code Companion API"
            description: "Error rate is above 5% for the last 2 minutes"

        - alert: AIDown
          expr: up{job="code-companion-edge-functions"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Edge functions are down"
            description: "Code Companion AI edge functions are not responding"

        - alert: HighLatency
          expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High API latency"
            description: "95th percentile latency is above 2 seconds"
